<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reservar cita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --primary-bg: rgba(99,102,241,0.1);
      --accent: #a5b4fc;
      --success: #22c55e;
      --success-bg: rgba(34,197,94,0.1);
      --danger: #c1292e;
      --bg: #ffffff;
      --surface: #f8f9fb;
      --surface-alt: #ffffff;
      --border: rgba(0,0,0,0.08);
      --text: #1a1a2e;
      --text-secondary: rgba(0,0,0,0.5);
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    }
    [data-theme="dark"] {
      --bg: #050505;
      --surface: #0a0a0f;
      --surface-alt: #111118;
      --border: rgba(255,255,255,0.08);
      --text: #fafafa;
      --text-secondary: rgba(255,255,255,0.5);
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    #embed-root { width: 100%; min-height: 100vh; }

    .progress-bar { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 20px; padding: 0 8px; }
    .progress-step { display: flex; flex-direction: column; align-items: center; z-index: 1; }
    .progress-step .dot {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--surface); color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; transition: all 0.3s ease;
      border: 1.5px solid var(--border);
    }
    .progress-step.active .dot {
      background: var(--primary); color: white;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
      transform: scale(1.05);
    }
    .progress-step.done .dot { background: var(--success); color: white; border-color: var(--success); }
    .progress-step .label { font-size: 9px; font-weight: 600; color: var(--text-secondary); margin-top: 6px; white-space: nowrap; }
    .progress-step.active .label { color: var(--primary); }
    .progress-step.done .label { color: var(--success); }
    .progress-line { width: 24px; height: 2px; background: var(--border); margin-bottom: 18px; transition: background 0.3s; }
    .progress-line.done { background: var(--success); }

    .main-card {
      width: 100%; min-height: 100vh;
      background: transparent; border: none;
      border-radius: 0; box-shadow: none;
      overflow: hidden; animation: slideUp 0.4s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .card-section { padding: 22px 20px; animation: fadeIn 0.3s ease; }
    .card-section + .card-section { border-top: 1px solid var(--border); }
    .section-title {
      font-size: 12px; font-weight: 700; color: var(--text-secondary);
      margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .section-title i {
      width: 26px; height: 26px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--primary); background: var(--primary-bg);
    }

    .option-card {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      cursor: pointer; transition: all 0.2s ease;
      margin-bottom: 8px; background: var(--surface); position: relative;
    }
    .option-card:hover { border-color: var(--primary); background: var(--primary-bg); }
    .option-card.selected { border-color: var(--primary); background: var(--primary-bg); box-shadow: 0 0 0 2px rgba(99,102,241,0.12); }
    .option-card.selected::after {
      content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: var(--primary); font-size: 11px;
    }
    .option-card .color-bar { width: 3px; height: 36px; border-radius: 3px; flex-shrink: 0; }
    .option-card .avatar {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .option-card .info { flex: 1; min-width: 0; }
    .option-card .name { font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 1px; }
    .option-card .desc { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; line-height: 1.3; }
    .option-card .meta { font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .option-card .price { font-weight: 800; font-size: 15px; color: var(--primary); white-space: nowrap; }
    .option-card .duration-badge {
      font-size: 10px; font-weight: 600; padding: 2px 7px;
      border-radius: 16px; background: var(--surface); color: var(--text-secondary);
      white-space: nowrap; display: inline-flex; align-items: center; gap: 3px;
    }

    .date-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .date-item {
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 3px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; background: var(--surface);
    }
    .date-item:hover { border-color: var(--primary); background: var(--primary-bg); }
    .date-item.selected { border-color: var(--primary); background: var(--primary); color: white; }
    .date-item .day-name { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); margin-bottom: 3px; }
    .date-item.selected .day-name { color: rgba(255,255,255,0.7); }
    .date-item .day-num { font-size: 18px; font-weight: 800; color: var(--text); }
    .date-item.selected .day-num { color: white; }
    .date-item .month { font-size: 9px; font-weight: 500; color: var(--text-secondary); margin-top: 1px; }
    .date-item.selected .month { color: rgba(255,255,255,0.6); }
    .date-item.today { border-color: var(--primary); border-style: dashed; }

    .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .time-slot {
      padding: 9px; text-align: center; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; background: var(--surface); color: var(--text-secondary);
    }
    .time-slot:hover:not(.disabled) { border-color: var(--primary); background: var(--primary-bg); }
    .time-slot.selected { background: var(--primary); color: white; border-color: var(--primary); }
    .time-slot.disabled { color: var(--text-secondary); opacity: 0.35; cursor: not-allowed; text-decoration: line-through; }

    .form-field { margin-bottom: 14px; }
    .form-field label { display: block; font-size: 10px; font-weight: 700; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-field input, .form-field textarea {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 13px; font-family: inherit;
      color: var(--text); background: var(--surface); transition: all 0.2s;
    }
    .form-field input:focus, .form-field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99,102,241,0.1); }
    .form-field input::placeholder { color: var(--text-secondary); opacity: 0.5; }
    .form-field.error input, .form-field.error textarea { border-color: var(--danger); }
    .form-field .field-error { font-size: 10px; color: var(--danger); margin-top: 3px; display: none; font-weight: 600; }
    .form-field.error .field-error { display: block; }

    .summary-box { background: var(--surface); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 14px; border: 1px solid var(--border); }
    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
    .summary-row + .summary-row { border-top: 1px solid var(--border); }
    .summary-row .label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
    .summary-row .value { font-size: 12px; font-weight: 700; color: var(--text); }

    .btn-back {
      display: inline-flex; align-items: center; gap: 5px; padding: 6px 0;
      font-size: 12px; font-weight: 600; color: var(--text-secondary); background: none; border: none;
      cursor: pointer; font-family: inherit; transition: color 0.2s; margin-bottom: 4px;
    }
    .btn-back:hover { color: var(--primary); }

    .btn-confirm {
      width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white; box-shadow: 0 4px 16px rgba(99,102,241,0.3);
    }
    .btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
    .btn-confirm:disabled { background: var(--border); box-shadow: none; cursor: not-allowed; transform: none; }

    .btn-secondary {
      width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
      background: var(--surface); color: var(--text-secondary); transition: all 0.2s;
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

    .success-screen { text-align: center; padding: 36px 20px; }
    .success-screen .check-circle {
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, var(--success), #16a34a);
      color: white; display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 18px;
      box-shadow: 0 8px 24px rgba(34,197,94,0.25);
      animation: pop 0.4s ease;
    }
    @keyframes pop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .success-screen h2 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .success-screen .detail { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .success-screen .business-name { font-weight: 700; color: var(--primary); margin-top: 12px; font-size: 15px; }
    .success-detail-card { background: var(--surface); border-radius: var(--radius-sm); padding: 14px; margin-top: 16px; text-align: left; border: 1px solid var(--border); }
    .success-detail-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; }
    .success-detail-row .s-label { color: var(--text-secondary); }
    .success-detail-row .s-value { font-weight: 600; color: var(--text); }
    .success-email-note { font-size: 11px; color: var(--text-secondary); margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 4px; }

    .error-screen { text-align: center; padding: 40px 20px; }
    .error-screen i { font-size: 40px; color: var(--danger); margin-bottom: 14px; opacity: 0.8; }
    .error-screen h2 { font-size: 16px; margin-bottom: 6px; color: var(--text); }
    .error-screen p { color: var(--text-secondary); font-size: 13px; line-height: 1.5; }

    .loading-screen { text-align: center; padding: 48px 20px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-screen p { color: var(--text-secondary); font-size: 13px; font-weight: 500; }

    .no-slots { text-align: center; padding: 24px; color: var(--text-secondary); font-size: 13px; }
    .no-slots i { font-size: 20px; margin-bottom: 8px; display: block; opacity: 0.5; }

    .category-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
    .category-pill {
      padding: 5px 10px; border-radius: 16px; font-size: 11px;
      border: 1.5px solid var(--border); background: var(--surface);
      color: var(--text-secondary); cursor: pointer; font-weight: 600;
      font-family: inherit; transition: all 0.2s;
    }
    .category-pill.active { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }

    @media (max-width: 380px) {
      .date-grid { grid-template-columns: repeat(3, 1fr); }
      .time-grid { grid-template-columns: repeat(2, 1fr); }
      .card-section { padding: 18px 14px; }
    }
  </style>
</head>
<body>
  <div id="embed-root">
    <div class="loading-screen"><div class="spinner"></div><p>Cargando servicios...</p></div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug') || window.location.pathname.split('/embed/')[1] || '';
      const theme = params.get('theme') || 'light';
      const primaryColor = params.get('color');

      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      if (primaryColor) {
        document.documentElement.style.setProperty('--primary', primaryColor);
        document.documentElement.style.setProperty('--primary-dark', primaryColor);
        document.documentElement.style.setProperty('--primary-bg', primaryColor + '1a');
      }

      let services = [], employees = [], selectedService = null, selectedEmployee = null, selectedDate = '', selectedTime = '';
      let businessData = null, currentStep = 1, selectedCategory = '';
      const root = document.getElementById('embed-root');

      const categoryLabels = { general:'General',cabello:'Cabello',barba:'Barba',cejas:'Cejas',facial:'Facial',uñas:'Uñas',masaje:'Masaje',maquillaje:'Maquillaje',depilacion:'Depilación',otro:'Otro' };

      function getInitials(name) { return (name || 'E').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase(); }
      function formatDateDisplay(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        const days = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        return { day: days[d.getDay()], num: d.getDate(), month: months[d.getMonth()], full: `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}` };
      }

      function notifyHeight() {
        setTimeout(() => {
          const h = document.body.scrollHeight;
          window.parent.postMessage({ type: 'gestria-embed-height', height: h }, '*');
        }, 100);
      }

      function buildProgressHTML(activeStep) {
        const steps = [
          { n: 1, label: 'Servicio', icon: 'fa-scissors' },
          { n: 2, label: 'Profesional', icon: 'fa-user' },
          { n: 3, label: 'Fecha', icon: 'fa-calendar' },
          { n: 4, label: 'Hora', icon: 'fa-clock' },
          { n: 5, label: 'Datos', icon: 'fa-pen' }
        ];
        let html = '<div class="progress-bar">';
        steps.forEach((s, i) => {
          const cls = s.n < activeStep ? 'done' : s.n === activeStep ? 'active' : '';
          html += `<div class="progress-step ${cls}"><div class="dot"><i class="fas ${s.icon}" style="font-size:11px"></i></div><div class="label">${s.label}</div></div>`;
          if (i < steps.length - 1) html += `<div class="progress-line ${s.n < activeStep ? 'done' : ''}"></div>`;
        });
        return html + '</div>';
      }

      async function init() {
        if (!slug) {
          root.innerHTML = '<div class="main-card"><div class="error-screen"><i class="fas fa-exclamation-triangle"></i><h2>Negocio no encontrado</h2><p>Configura el slug en el parámetro de la URL.</p></div></div>';
          notifyHeight();
          return;
        }
        try {
          const res = await fetch(`/api/public/${slug}`);
          if (!res.ok) throw new Error('Negocio no encontrado');
          const data = await res.json();
          businessData = data;
          services = (data.services || []).filter(s => s.active !== false);
          employees = (data.employees || []).filter(e => e.active !== false);
          renderStep(0);
        } catch (e) {
          root.innerHTML = '<div class="main-card"><div class="error-screen"><i class="fas fa-exclamation-triangle"></i><h2>Negocio no encontrado</h2><p>El enlace no es válido o el negocio no está disponible.</p></div></div>';
          notifyHeight();
        }
      }

      function renderStep(step) {
        currentStep = step;
        ({ 0: renderStep0, 1: renderStep1, 2: renderStep2, 3: renderStep3, 4: renderStep4, 5: renderStep5 })[step]?.();
        notifyHeight();
      }

      function renderStep0() {
        const biz = businessData?.settings || {};
        root.innerHTML = `
          <div class="main-card"><div class="card-section" style="text-align:center">
            <div class="section-title" style="justify-content:center"><i class="fas fa-hand-pointer"></i> ¿Qué necesitas?</div>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
              <div class="option-card" style="justify-content:center;padding:18px 14px;cursor:pointer" data-action="create">
                <i class="fas fa-plus-circle" style="font-size:24px;color:var(--success);margin-right:10px"></i>
                <div class="info" style="text-align:left">
                  <div class="name" style="font-size:15px">Crear reserva</div>
                  <div class="desc">Agenda una nueva cita</div>
                </div>
              </div>
              <div class="option-card" style="justify-content:center;padding:18px 14px;cursor:pointer" data-action="cancel">
                <i class="fas fa-times-circle" style="font-size:24px;color:var(--danger);margin-right:10px"></i>
                <div class="info" style="text-align:left">
                  <div class="name" style="font-size:15px">Cancelar reserva</div>
                  <div class="desc">Cancela una cita existente</div>
                </div>
              </div>
            </div>
          </div></div>`;

        root.querySelector('[data-action="create"]').addEventListener('click', () => renderStep(1));
        root.querySelector('[data-action="cancel"]').addEventListener('click', showCancelView);
      }

      function showCancelView() {
        root.innerHTML = `
          <div class="main-card">
            <div class="card-section">
              <button class="btn-back" id="btn-back-cancel"><i class="fas fa-arrow-left"></i> Volver</button>
              <div class="section-title"><i class="fas fa-times-circle"></i> Cancelar reserva</div>
              <p style="font-size:12px;color:var(--text-secondary);margin-bottom:14px;line-height:1.5">Introduce tu ID de reserva para ver los detalles y cancelar tu cita.</p>
              <div class="form-field" id="cancel-id-field">
                <label>ID de reserva</label>
                <input type="text" id="cancel-id-input" placeholder="Ej: A1B2C3D4" style="font-family:monospace;letter-spacing:2px;text-align:center;font-size:15px;font-weight:700">
                <div class="field-error">Introduce un ID válido</div>
              </div>
              <div id="cancel-error-msg" style="display:none;background:var(--danger-bg);border-radius:var(--radius-sm);padding:10px;margin-bottom:14px;font-size:12px;color:var(--danger);font-weight:500"></div>
              <button class="btn-confirm" id="btn-cancel-search"><i class="fas fa-search"></i> Buscar reserva</button>
            </div>
          </div>`;

        document.getElementById('btn-back-cancel').addEventListener('click', renderStep0);
        document.getElementById('btn-cancel-search').addEventListener('click', searchForCancel);
        document.getElementById('cancel-id-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchForCancel(); });
        notifyHeight();
      }

      async function searchForCancel() {
        const id = document.getElementById('cancel-id-input').value.trim();
        const errEl = document.getElementById('cancel-error-msg');
        errEl.style.display = 'none';
        if (!id) { document.getElementById('cancel-id-field').classList.add('error'); return; }
        document.getElementById('cancel-id-field').classList.remove('error');

        const btn = document.getElementById('btn-cancel-search');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></div>';

        try {
          const res = await fetch(`/api/public/${slug}/booking/${id}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          if (data.status === 'cancelled') throw new Error('Esta reserva ya ha sido cancelada');
          if (data.status !== 'confirmed') throw new Error('Esta reserva no se puede cancelar');
          showCancelConfirm(data);
        } catch (e) {
          errEl.textContent = e.message || 'No se encontró la reserva';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-search"></i> Buscar reserva';
          notifyHeight();
        }
      }

      function showCancelConfirm(b) {
        const dateInfo = formatDateDisplay(b.date);
        root.innerHTML = `
          <div class="main-card">
            <div class="card-section">
              <button class="btn-back" id="btn-back-cancel2"><i class="fas fa-arrow-left"></i> Volver</button>
              <div class="section-title"><i class="fas fa-file-alt"></i> Detalles de tu reserva</div>
              <div class="summary-box">
                <div class="summary-row"><div class="label">Servicio</div><div class="value">${b.service_name}</div></div>
                <div class="summary-row"><div class="label">Fecha</div><div class="value">${dateInfo.full}</div></div>
                <div class="summary-row"><div class="label">Hora</div><div class="value">${b.start_time} - ${b.end_time}</div></div>
                ${b.employee_name ? `<div class="summary-row"><div class="label">Profesional</div><div class="value">${b.employee_name}</div></div>` : ''}
                <div class="summary-row"><div class="label">Cliente</div><div class="value">${b.client_name}</div></div>
                <div class="summary-row"><div class="label">Precio</div><div class="value" style="color:var(--success)">€${b.service_price}</div></div>
              </div>
              <div style="background:var(--danger-bg);border:1px solid rgba(193,41,46,0.2);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;display:flex;align-items:flex-start;gap:8px">
                <i class="fas fa-exclamation-triangle" style="color:var(--danger);font-size:13px;margin-top:1px;flex-shrink:0"></i>
                <p style="font-size:11px;color:var(--text-secondary);line-height:1.5">¿Estás seguro? Esta acción no se puede deshacer.</p>
              </div>
              <div style="display:flex;gap:8px">
                <button class="btn-secondary" id="btn-keep" style="flex:1"><i class="fas fa-heart"></i> No, mantener</button>
                <button class="btn-confirm" style="background:linear-gradient(135deg,#991b1b,#dc2626);box-shadow:0 4px 16px rgba(193,41,46,0.3);flex:1" id="btn-do-cancel"><i class="fas fa-trash-alt"></i> Sí, cancelar</button>
              </div>
            </div>
          </div>`;

        document.getElementById('btn-back-cancel2').addEventListener('click', showCancelView);
        document.getElementById('btn-keep').addEventListener('click', () => {
          root.innerHTML = `
            <div class="main-card"><div class="success-screen">
              <div class="check-circle" style="background:linear-gradient(135deg,var(--primary),#8b5cf6)"><i class="fas fa-heart" style="font-size:26px"></i></div>
              <h2>Reserva intacta</h2>
              <div class="detail">Tu reserva sigue confirmada. ¡Te esperamos!</div>
              <button class="btn-confirm" style="margin-top:20px;max-width:200px;margin-left:auto;margin-right:auto" id="btn-back-home"><i class="fas fa-arrow-left"></i> Volver</button>
            </div></div>`;
          document.getElementById('btn-back-home').addEventListener('click', renderStep0);
          notifyHeight();
        });
        document.getElementById('btn-do-cancel').addEventListener('click', () => doCancelBooking(b.booking_id));
        notifyHeight();
      }

      async function doCancelBooking(bookingId) {
        const btn = document.getElementById('btn-do-cancel');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0;border-top-color:white"></div>';
        try {
          const res = await fetch(`/api/public/${slug}/cancel`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ booking_id: bookingId })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          root.innerHTML = `
            <div class="main-card"><div class="success-screen">
              <div class="check-circle"><i class="fas fa-check"></i></div>
              <h2>Reserva cancelada</h2>
              <div class="detail">Tu reserva ha sido cancelada correctamente.<br>Si tienes dudas, contacta directamente con el negocio.</div>
              <button class="btn-confirm" style="margin-top:20px;max-width:200px;margin-left:auto;margin-right:auto" id="btn-back-home2"><i class="fas fa-arrow-left"></i> Volver</button>
            </div></div>`;
          document.getElementById('btn-back-home2').addEventListener('click', renderStep0);
        } catch (e) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-trash-alt"></i> Sí, cancelar';
          document.getElementById('cancel-error-msg').textContent = e.message;
          document.getElementById('cancel-error-msg').style.display = 'block';
        }
        notifyHeight();
      }

      function renderStep1() {
        const categories = [...new Set(services.map(s => s.category || 'general'))];
        const filtered = selectedCategory ? services.filter(s => (s.category || 'general') === selectedCategory) : services;
        root.innerHTML = `
          ${buildProgressHTML(1)}
          <div class="main-card"><div class="card-section">
            <button class="btn-back" id="btn-back-step1"><i class="fas fa-arrow-left"></i> Volver</button>
            <div class="section-title"><i class="fas fa-scissors"></i> Elige un servicio</div>
            ${categories.length > 1 ? `<div class="category-pills"><button class="category-pill ${!selectedCategory ? 'active' : ''}" data-cat="">Todos</button>${categories.map(c => `<button class="category-pill ${selectedCategory === c ? 'active' : ''}" data-cat="${c}">${categoryLabels[c] || c}</button>`).join('')}</div>` : ''}
            ${filtered.length === 0 ? '<div class="no-slots"><i class="fas fa-info-circle"></i>No hay servicios disponibles</div>' : ''}
            ${filtered.map(s => `
              <div class="option-card" data-sid="${s.id}">
                <div class="color-bar" style="background:${s.color || '#415a77'}"></div>
                <div class="info">
                  <div class="name">${s.name}</div>
                  ${s.description ? `<div class="desc">${s.description}</div>` : ''}
                  <div class="meta"><span class="duration-badge"><i class="fas fa-clock"></i>${s.duration || 30} min</span>${s.category && s.category !== 'general' ? `<span class="duration-badge">${categoryLabels[s.category] || s.category}</span>` : ''}</div>
                </div>
                <div class="price">€${s.price}</div>
              </div>`).join('')}
          </div></div>`;

        document.getElementById('btn-back-step1').addEventListener('click', renderStep0);
        root.querySelectorAll('.category-pill').forEach(btn => {
          btn.addEventListener('click', () => { selectedCategory = btn.dataset.cat; renderStep1(); });
        });
        root.querySelectorAll('.option-card[data-sid]').forEach(card => {
          card.addEventListener('click', () => {
            selectedService = services.find(s => s.id === card.dataset.sid);
            selectedEmployee = null;
            root.querySelectorAll('.option-card').forEach(el => el.classList.remove('selected'));
            card.classList.add('selected');
            setTimeout(() => renderStep(2), 180);
          });
        });
      }

      function renderStep2() {
        const empForService = employees.filter(e => e.services?.some(s => s.id === selectedService.id));
        const list = empForService.length === 0 ? employees : empForService;
        root.innerHTML = `
          ${buildProgressHTML(2)}
          <div class="main-card">
            <div class="card-section">
              <button class="btn-back" id="btn-back-2"><i class="fas fa-arrow-left"></i> Volver</button>
              <div class="section-title"><i class="fas fa-user"></i> Elige un profesional</div>
              ${list.length === 0 ? '<div class="no-slots"><i class="fas fa-user-slash"></i>No hay profesionales disponibles</div>' : ''}
              ${list.map(e => `
                <div class="option-card" data-eid="${e.id}">
                  <div class="avatar" style="background:${e.color || '#415a77'}">${getInitials(e.name)}</div>
                  <div class="info">
                    <div class="name">${e.name}</div>
                    <div class="meta">${e.services?.length || 0} servicios</div>
                  </div>
                </div>`).join('')}
            </div>
            <div class="card-section" style="padding-top:0">
              <button class="btn-secondary" id="btn-any"><i class="fas fa-forward"></i> Cualquier disponible</button>
            </div>
          </div>`;

        document.getElementById('btn-back-2').addEventListener('click', () => renderStep(1));
        document.getElementById('btn-any').addEventListener('click', () => renderStep(3));
        root.querySelectorAll('.option-card[data-eid]').forEach(card => {
          card.addEventListener('click', () => {
            selectedEmployee = employees.find(e => e.id === card.dataset.eid);
            root.querySelectorAll('.option-card').forEach(el => el.classList.remove('selected'));
            card.classList.add('selected');
            setTimeout(() => renderStep(3), 180);
          });
        });
      }

      function renderStep3() {
        const today = new Date();
        const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        const days = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        const dates = [];
        for (let i = 0; i < 14; i++) {
          const d = new Date(today); d.setDate(today.getDate() + i);
          dates.push({ str: d.toISOString().split('T')[0], day: days[d.getDay()], num: d.getDate(), month: months[d.getMonth()], isToday: i === 0 });
        }
        root.innerHTML = `
          ${buildProgressHTML(3)}
          <div class="main-card"><div class="card-section">
            <button class="btn-back" id="btn-back-3"><i class="fas fa-arrow-left"></i> Volver</button>
            <div class="section-title"><i class="fas fa-calendar"></i> Elige una fecha</div>
            <div class="date-grid">
              ${dates.map(d => `<div class="date-item ${d.isToday ? 'today' : ''}" data-date="${d.str}"><div class="day-name">${d.day}</div><div class="day-num">${d.num}</div><div class="month">${d.month}</div></div>`).join('')}
            </div>
          </div></div>`;

        document.getElementById('btn-back-3').addEventListener('click', () => renderStep(2));
        root.querySelectorAll('.date-item').forEach(item => {
          item.addEventListener('click', () => {
            selectedDate = item.dataset.date;
            root.querySelectorAll('.date-item').forEach(el => el.classList.remove('selected'));
            item.classList.add('selected');
            setTimeout(() => renderStep(4), 180);
          });
        });
      }

      async function renderStep4() {
        root.innerHTML = `
          ${buildProgressHTML(4)}
          <div class="main-card"><div class="card-section" style="text-align:center;padding:36px 20px">
            <div class="spinner"></div><p style="color:var(--text-secondary);font-size:13px">Buscando horarios...</p>
          </div></div>`;
        notifyHeight();
        try {
          const res = await fetch(`/api/public/${slug}/slots?date=${selectedDate}&service_id=${selectedService.id}&employee_id=${selectedEmployee?.id || ''}`);
          const data = await res.json();
          let slots = data.slots || [];
          const now = new Date();
          const todayStr = now.toISOString().split('T')[0];
          if (selectedDate === todayStr) {
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            slots = slots.map(s => {
              const [h, m] = s.time.split(':').map(Number);
              if (h * 60 + m <= currentMinutes) return { ...s, available: false };
              return s;
            });
          }
          const dateInfo = formatDateDisplay(selectedDate);
          root.innerHTML = `
            ${buildProgressHTML(4)}
            <div class="main-card"><div class="card-section">
              <button class="btn-back" id="btn-back-4"><i class="fas fa-arrow-left"></i> Volver</button>
              <div class="section-title"><i class="fas fa-clock"></i> Horarios — ${dateInfo.full}</div>
              ${slots.length === 0 ? '<div class="no-slots"><i class="fas fa-calendar-xmark"></i>No hay horarios disponibles para esta fecha</div>' : ''}
              ${slots.length > 0 ? `<div class="time-grid">${slots.map(s => `<div class="time-slot ${s.available ? '' : 'disabled'}" data-time="${s.time}" ${s.available ? '' : 'data-disabled="1"'}>${s.time}</div>`).join('')}</div>` : ''}
            </div></div>`;

          document.getElementById('btn-back-4').addEventListener('click', () => renderStep(3));
          root.querySelectorAll('.time-slot:not([data-disabled])').forEach(slot => {
            slot.addEventListener('click', () => {
              selectedTime = slot.dataset.time;
              root.querySelectorAll('.time-slot').forEach(el => el.classList.remove('selected'));
              slot.classList.add('selected');
              setTimeout(() => renderStep(5), 180);
            });
          });
        } catch (e) {
          root.innerHTML = `
            ${buildProgressHTML(4)}
            <div class="main-card"><div class="error-screen">
              <i class="fas fa-exclamation-circle"></i><h2>Error al cargar horarios</h2><p>Intenta de nuevo o selecciona otra fecha.</p>
            </div></div>`;
        }
        notifyHeight();
      }

      function renderStep5() {
        const dateInfo = formatDateDisplay(selectedDate);
        const biz = businessData?.settings || {};
        root.innerHTML = `
          ${buildProgressHTML(5)}
          <div class="main-card">
            <div class="card-section">
              <button class="btn-back" id="btn-back-5"><i class="fas fa-arrow-left"></i> Volver</button>
              <div class="summary-box">
                <div class="summary-row"><div class="label">Servicio</div><div class="value">${selectedService.name} — €${selectedService.price}</div></div>
                <div class="summary-row"><div class="label">Duración</div><div class="value">${selectedService.duration || 30} min</div></div>
                <div class="summary-row"><div class="label">Profesional</div><div class="value">${selectedEmployee?.name || 'Cualquier disponible'}</div></div>
                <div class="summary-row"><div class="label">Fecha</div><div class="value">${dateInfo.full}</div></div>
                <div class="summary-row"><div class="label">Hora</div><div class="value">${selectedTime}</div></div>
              </div>
            </div>
            <div class="card-section">
              <div class="section-title"><i class="fas fa-pen"></i> Tus datos</div>
              <div class="form-field"><label>Nombre completo *</label><input type="text" id="bk-name" placeholder="Tu nombre"><div class="field-error">El nombre es obligatorio</div></div>
              <div class="form-field" id="phone-field"><label>Teléfono *</label><input type="tel" id="bk-phone" placeholder="+34 600 000 000"><div class="field-error">Introduce un teléfono válido</div></div>
              <div class="form-field" id="email-field"><label>Email *</label><input type="email" id="bk-email" placeholder="tu@email.com"><div class="field-error">Introduce un email válido</div></div>
              <p style="font-size:10px;color:var(--text-secondary);margin:-8px 0 14px;font-weight:500">* Obligatorio: teléfono o email (al menos uno)</p>
              <div class="form-field"><label>Notas</label><textarea id="bk-notes" rows="2" placeholder="Indicaciones especiales..."></textarea></div>
            </div>
            <div class="card-section" style="padding-top:0">
              <button class="btn-confirm" id="btn-book"><i class="fas fa-check-circle"></i> Confirmar reserva</button>
            </div>
          </div>`;

        document.getElementById('btn-back-5').addEventListener('click', () => renderStep(4));
        document.getElementById('btn-book').addEventListener('click', confirmBooking);
        notifyHeight();
      }

      function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
      function isValidPhone(p) { return /^\+?\d{7,15}$/.test(p.replace(/[\s\-()]/g, '')); }

      async function confirmBooking() {
        const name = document.getElementById('bk-name').value.trim();
        const phone = document.getElementById('bk-phone').value.trim();
        const email = document.getElementById('bk-email').value.trim();
        let valid = true;
        root.querySelectorAll('.form-field').forEach(f => f.classList.remove('error'));

        if (!name) { document.getElementById('bk-name').parentElement.classList.add('error'); if (valid) document.getElementById('bk-name').focus(); valid = false; }
        if (!phone && !email) { document.getElementById('phone-field').classList.add('error'); document.getElementById('email-field').classList.add('error'); if (valid) document.getElementById('bk-phone').focus(); valid = false; }
        if (phone && !isValidPhone(phone)) { document.getElementById('phone-field').classList.add('error'); if (valid) document.getElementById('bk-phone').focus(); valid = false; }
        if (email && !isValidEmail(email)) { document.getElementById('email-field').classList.add('error'); if (valid) document.getElementById('bk-email').focus(); valid = false; }
        if (!valid) { notifyHeight(); return; }

        const btn = document.getElementById('btn-book');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></div> Procesando...';

        try {
          const res = await fetch(`/api/public/${slug}/book`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              client_name: name, client_phone: phone, client_email: email,
              notes: document.getElementById('bk-notes').value,
              service_id: selectedService.id, employee_id: selectedEmployee?.id || null,
              date: selectedDate, start_time: selectedTime
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);

          const dateInfo = formatDateDisplay(selectedDate);
          const biz = businessData?.settings || {};
          const bookingShortId = data.booking_id ? data.booking_id.slice(-8).toUpperCase() : '';

          root.innerHTML = `
            <div class="main-card"><div class="success-screen">
              <div class="check-circle"><i class="fas fa-check"></i></div>
              <h2>Reserva confirmada</h2>
              <div class="detail">Tu cita ha sido registrada correctamente</div>
              <div class="success-detail-card">
                <div class="success-detail-row"><span class="s-label">Servicio</span><span class="s-value">${selectedService.name}</span></div>
                <div class="success-detail-row"><span class="s-label">Fecha</span><span class="s-value">${dateInfo.full}</span></div>
                <div class="success-detail-row"><span class="s-label">Hora</span><span class="s-value">${selectedTime}</span></div>
                ${selectedEmployee ? `<div class="success-detail-row"><span class="s-label">Profesional</span><span class="s-value">${selectedEmployee.name}</span></div>` : ''}
                <div class="success-detail-row"><span class="s-label">Precio</span><span class="s-value" style="color:var(--success)">€${selectedService.price}</span></div>
              </div>
              ${bookingShortId ? `<div style="margin-top:16px;background:var(--surface);border:1.5px dashed var(--primary);border-radius:var(--radius-sm);padding:14px;text-align:center">
                <div style="font-size:9px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px">Tu ID de reserva</div>
                <div style="font-size:20px;font-weight:800;color:var(--primary);letter-spacing:2px;font-family:monospace">${bookingShortId}</div>
                <div style="font-size:10px;color:var(--danger);font-weight:600;margin-top:6px"><i class="fas fa-exclamation-triangle"></i> Guarda este ID — lo necesitarás si quieres cancelar tu reserva</div>
              </div>` : ''}
              ${email ? '<div class="success-email-note"><i class="fas fa-envelope"></i> Se ha enviado un email de confirmación</div>' : ''}
              <div class="business-name">${biz.business_name || slug}</div>
            </div></div>`;

          window.parent.postMessage({ type: 'gestria-booking-confirmed', booking: { service: selectedService.name, date: selectedDate, time: selectedTime } }, '*');
        } catch (e) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check-circle"></i> Confirmar reserva';
          root.innerHTML = `
            <div class="main-card"><div class="error-screen">
              <i class="fas fa-exclamation-circle"></i>
              <h2>Error al reservar</h2>
              <p>${e.message || 'Intenta de nuevo más tarde.'}</p>
              <button class="btn-confirm" style="margin-top:16px;max-width:180px;margin-left:auto;margin-right:auto" id="btn-retry"><i class="fas fa-arrow-left"></i> Volver</button>
            </div></div>`;
          document.getElementById('btn-retry').addEventListener('click', () => renderStep(5));
        }
        notifyHeight();
      }

      window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'gestria-embed-navigate') {
          if (e.data.step) renderStep(e.data.step);
        }
      });

      init();
    })();
  </script>
</body>
</html>
