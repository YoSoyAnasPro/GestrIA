<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <title>Cancelar reserva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-bg: rgba(99,102,241,0.1);
      --success: #22c55e;
      --danger: #c1292e;
      --danger-bg: rgba(193,41,46,0.08);
      --bg: #050505;
      --surface: #0a0a0f;
      --surface-alt: #111118;
      --border: rgba(255,255,255,0.08);
      --text: #fafafa;
      --text-secondary: rgba(255,255,255,0.5);
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background-image: radial-gradient(ellipse at 20% 0%, rgba(193,41,46,0.06) 0%, transparent 60%);
    }
    .card {
      width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; box-shadow: 0 24px 64px rgba(0,0,0,0.5); overflow: hidden;
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .card-section { padding: 32px 28px; }
    .card-section + .card-section { border-top: 1px solid var(--border); }
    .title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 24px; }
    .form-field { margin-bottom: 18px; }
    .form-field label { display: block; font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-field input {
      width: 100%; padding: 14px 16px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 18px; font-family: monospace;
      color: var(--text); background: var(--surface-alt); transition: all 0.25s;
      letter-spacing: 3px; text-align: center; font-weight: 700;
    }
    .form-field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .form-field input::placeholder { color: rgba(255,255,255,0.2); letter-spacing: 1px; font-size: 14px; font-weight: 400; }
    .form-field.error input { border-color: var(--danger); }
    .form-field .field-error { font-size: 11px; color: var(--danger); margin-top: 6px; display: none; font-weight: 600; }
    .form-field.error .field-error { display: block; }
    .btn {
      width: 100%; padding: 15px; border: none; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1); display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white; box-shadow: 0 6px 24px rgba(99,102,241,0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(99,102,241,0.45); }
    .btn-primary:disabled { background: rgba(255,255,255,0.1); box-shadow: none; cursor: not-allowed; transform: none; }
    .btn-danger { background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%); color: white; box-shadow: 0 6px 24px rgba(193,41,46,0.35); }
    .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(193,41,46,0.45); }
    .btn-back { background: none; border: none; color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; padding: 0; margin-bottom: 16px; transition: color 0.2s; }
    .btn-back:hover { color: var(--primary); }
    .booking-details { background: var(--surface-alt); border-radius: var(--radius-sm); padding: 18px; margin-bottom: 20px; border: 1px solid var(--border); }
    .detail-row { display: flex; justify-content: space-between; padding: 7px 0; }
    .detail-row + .detail-row { border-top: 1px solid var(--border); }
    .detail-row .d-label { font-size: 12px; color: var(--text-secondary); }
    .detail-row .d-value { font-size: 13px; font-weight: 700; color: var(--text); }
    .warning-box { background: var(--danger-bg); border: 1px solid rgba(193,41,46,0.2); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 18px; display: flex; align-items: flex-start; gap: 10px; }
    .warning-box i { color: var(--danger); font-size: 16px; margin-top: 1px; flex-shrink: 0; }
    .warning-box p { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .success-screen { text-align: center; padding: 48px 28px; }
    .success-screen .check-circle {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, var(--success), #16a34a);
      color: white; display: flex; align-items: center; justify-content: center;
      font-size: 30px; margin: 0 auto 20px;
      box-shadow: 0 12px 32px rgba(34,197,94,0.3);
    }
    .success-screen h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .success-screen p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
    .error-screen { text-align: center; padding: 48px 28px; }
    .error-screen i { font-size: 48px; color: var(--danger); margin-bottom: 18px; opacity: 0.8; }
    .error-screen h2 { font-size: 18px; margin-bottom: 8px; }
    .error-screen p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .confirm-actions { display: flex; gap: 10px; margin-top: 4px; }
    .confirm-actions .btn { flex: 1; padding: 13px 12px; }
    .btn-cancel { background: var(--surface-alt); border: 1.5px solid var(--border); color: var(--text-secondary); box-shadow: none; }
    .btn-cancel:hover { border-color: var(--primary); color: var(--primary); }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="card-section" style="text-align:center;padding:48px 28px">
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug') || '';
    const prefillId = params.get('id') || '';
    let bookingData = null;

    function renderForm(bookingId, error) {
      document.getElementById('app').innerHTML = `
        <div class="card-section">
          <div class="title"><i class="fas fa-times-circle" style="color:var(--danger)"></i> Cancelar reserva</div>
          <div class="subtitle">Introduce tu ID de reserva para ver los detalles y cancelar tu cita.</div>
          <div class="form-field" id="id-field">
            <label>ID de reserva</label>
            <input type="text" id="cancel-id" placeholder="Ej: A1B2C3D4" value="${bookingId || ''}" maxlength="50">
            <div class="field-error">Introduce un ID de reserva válido</div>
          </div>
          ${error ? `<div style="background:var(--danger-bg);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;font-size:13px;color:var(--danger);font-weight:500"><i class="fas fa-exclamation-circle" style="margin-right:6px"></i>${error}</div>` : ''}
          <button class="btn btn-primary" id="btn-search"><i class="fas fa-search"></i> Buscar reserva</button>
        </div>`;
      document.getElementById('btn-search').addEventListener('click', searchBooking);
      document.getElementById('cancel-id').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchBooking(); });
    }

    function renderConfirm() {
      const b = bookingData;
      const d = new Date(b.date + 'T00:00:00');
      const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      const days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
      const dateStr = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;

      document.getElementById('app').innerHTML = `
        <div class="card-section">
          <button class="btn-back" id="btn-back"><i class="fas fa-arrow-left"></i> Volver</button>
          <div class="title">Detalles de tu reserva</div>
          <div class="booking-details">
            <div class="detail-row"><div class="d-label">Servicio</div><div class="d-value">${b.service_name}</div></div>
            <div class="detail-row"><div class="d-label">Fecha</div><div class="d-value">${dateStr}</div></div>
            <div class="detail-row"><div class="d-label">Hora</div><div class="d-value">${b.start_time} - ${b.end_time}</div></div>
            ${b.employee_name ? `<div class="detail-row"><div class="d-label">Profesional</div><div class="d-value">${b.employee_name}</div></div>` : ''}
            <div class="detail-row"><div class="d-label">Cliente</div><div class="d-value">${b.client_name}</div></div>
            <div class="detail-row"><div class="d-label">Precio</div><div class="d-value" style="color:var(--success)">€${b.service_price}</div></div>
          </div>
          <div class="warning-box">
            <i class="fas fa-exclamation-triangle"></i>
            <p>¿Estás seguro de que quieres cancelar esta reserva? Esta acción no se puede deshacer.</p>
          </div>
          <div class="confirm-actions">
            <button class="btn btn-cancel" id="btn-no">No, mantener</button>
            <button class="btn btn-danger" id="btn-yes"><i class="fas fa-trash-alt"></i> Sí, cancelar</button>
          </div>
        </div>`;
      document.getElementById('btn-back').addEventListener('click', () => renderForm(bookingData.booking_id));
      document.getElementById('btn-no').addEventListener('click', renderSuccessNoCancel);
      document.getElementById('btn-yes').addEventListener('click', confirmCancel);
    }

    function renderSuccessNoCancel() {
      document.getElementById('app').innerHTML = `
        <div class="card-section">
          <div class="success-screen">
            <div class="check-circle" style="background:linear-gradient(135deg,var(--primary),#8b5cf6)"><i class="fas fa-heart" style="font-size:28px"></i></div>
            <h2>Reserva intacta</h2>
            <p>Tu reserva sigue confirmada. ¡Te esperamos!</p>
          </div>
        </div>`;
    }

    function renderCancelled() {
      document.getElementById('app').innerHTML = `
        <div class="card-section">
          <div class="success-screen">
            <div class="check-circle"><i class="fas fa-check"></i></div>
            <h2>Reserva cancelada</h2>
            <p>Tu reserva ha sido cancelada correctamente.<br>Si tienes dudas, contacta directamente con el negocio.</p>
          </div>
        </div>`;
    }

    function renderError(msg) {
      document.getElementById('app').innerHTML = `
        <div class="card-section">
          <div class="error-screen">
            <i class="fas fa-exclamation-circle"></i>
            <h2>Algo salió mal</h2>
            <p>${msg}</p>
            <button class="btn btn-primary" style="margin-top:20px;max-width:200px" id="btn-retry"><i class="fas fa-arrow-left"></i> Intentar de nuevo</button>
          </div>
        </div>`;
      document.getElementById('btn-retry').addEventListener('click', () => renderForm(''));
    }

    async function searchBooking() {
      const id = document.getElementById('cancel-id').value.trim();
      if (!id) { document.getElementById('id-field').classList.add('error'); return; }
      document.getElementById('id-field').classList.remove('error');

      const btn = document.getElementById('btn-search');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></div>';

      try {
        const res = await fetch(`/api/public/${slug}/booking/${id}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        if (data.status === 'cancelled') throw new Error('Esta reserva ya ha sido cancelada');
        if (data.status !== 'confirmed') throw new Error('Esta reserva no se puede cancelar (estado: ' + data.status + ')');
        bookingData = data;
        renderConfirm();
      } catch (e) {
        renderForm(id, e.message || 'No se encontró la reserva');
      }
    }

    async function confirmCancel() {
      const btn = document.getElementById('btn-yes');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0;border-top-color:white"></div> Cancelando...';

      try {
        const res = await fetch(`/api/public/${slug}/cancel`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ booking_id: bookingData.booking_id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        renderCancelled();
      } catch (e) {
        renderError(e.message || 'No se pudo cancelar la reserva');
      }
    }

    if (!slug) {
      document.getElementById('app').innerHTML = `
        <div class="card-section">
          <div class="error-screen">
            <i class="fas fa-exclamation-triangle"></i>
            <h2>Negocio no encontrado</h2>
            <p>El enlace no es válido. Solicita el enlace correcto al negocio.</p>
          </div>
        </div>`;
    } else {
      renderForm(prefillId);
    }
  </script>
</body>
</html>
